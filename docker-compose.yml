services:
  app:
    build: .
    image: bookmarks-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_PATH: /app/var/bookmarks.sqlite
      APP_DEBUG: "0"
    volumes:
      # Mount the source for development; keep vendor/ inside the container
      # so the host never needs PHP or Composer.
      - .:/app
      - vendor:/app/vendor

volumes:
  vendor:
